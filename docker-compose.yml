name: ${PROJECT_NAME}

services:
  mariadb:
    image: mariadb:${MARIADB_TAG}
    container_name: "${PROJECT_NAME}_mariadb"
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MARIADB_DATABASE: ${DB_NAME}
      MARIADB_USER: ${DB_USER}
      MARIADB_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20

  wordpress:
    image: wordpress:${WORDPRESS_TAG}
    container_name: "${PROJECT_NAME}_wordpress"
    depends_on:
      mariadb:
        condition: service_healthy
    networks:
      - default
      - traefik
    environment: &wp-env
      WORDPRESS_DB_HOST: mariadb
      WORDPRESS_DB_NAME: ${DB_NAME}
      WORDPRESS_DB_USER: ${DB_USER}
      WORDPRESS_DB_PASSWORD: ${DB_PASSWORD}
      WORDPRESS_DEBUG: 1
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_HOME', 'https://${PROJECT_BASE_URL}');
        define('WP_SITEURL', 'https://${PROJECT_BASE_URL}');
        define('WP_ENVIRONMENT_TYPE', 'local');
        define('WP_DEBUG_LOG', true);
        define('WP_DEBUG_DISPLAY', false);
        define('DISALLOW_FILE_EDIT', true);
        if (($$_SERVER['HTTP_X_FORWARDED_PROTO'] ?? '') === 'https') { $$_SERVER['HTTPS'] = 'on'; }
    volumes: &wp-volumes
      - wp:/var/www/html
      - ./theme:/var/www/html/wp-content/themes/glitter
      - ./local/mu-plugins:/var/www/html/wp-content/mu-plugins
      - ./scripts:/scripts:ro
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.${PROJECT_NAME}_wp.entrypoints=https"
      - "traefik.http.routers.${PROJECT_NAME}_wp.rule=Host(`${PROJECT_BASE_URL}`)"
      - "traefik.http.routers.${PROJECT_NAME}_wp.tls=true"
      - "traefik.http.services.${PROJECT_NAME}_wp.loadbalancer.server.port=80"
      - "traefik.http.routers.${PROJECT_NAME}_wp.service=${PROJECT_NAME}_wp@docker"
      - "traefik.docker.network=traefik_proxy"

  # One-off WP-CLI runs: `make wp -- <args>`
  wpcli:
    image: wordpress:${WPCLI_TAG}
    user: "33:33"
    depends_on:
      mariadb:
        condition: service_healthy
    environment:
      <<: *wp-env
      HOME: /tmp
    volumes: *wp-volumes
    profiles: ["tools"]

  mailpit:
    image: axllent/mailpit:${MAILPIT_TAG}
    container_name: "${PROJECT_NAME}_mailpit"
    networks:
      - default
      - traefik
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.${PROJECT_NAME}_mail.entrypoints=https"
      - "traefik.http.routers.${PROJECT_NAME}_mail.rule=Host(`mail-${PROJECT_BASE_URL}`)"
      - "traefik.http.routers.${PROJECT_NAME}_mail.tls=true"
      - "traefik.http.services.${PROJECT_NAME}_mail.loadbalancer.server.port=8025"
      - "traefik.http.routers.${PROJECT_NAME}_mail.service=${PROJECT_NAME}_mail@docker"
      - "traefik.docker.network=traefik_proxy"

volumes:
  db:
    name: ${PROJECT_NAME}-db
  wp:
    name: ${PROJECT_NAME}-wp

networks:
  traefik:
    name: traefik_proxy
    external: true
