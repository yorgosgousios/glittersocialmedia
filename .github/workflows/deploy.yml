name: Deploy

# Deploys the theme folder to the Papaki hosting over FTPS (lftp) after CI passes on main.
# Runs only while the repo variable DEPLOY_ENABLED is "true". Uploads theme/ only.
# Setup (repo → Settings → Secrets and variables → Actions):
#   secrets:   FTP_HOST (linux72.papaki.gr — the server name, not the domain), FTP_USERNAME, FTP_PASSWORD,
#              FTP_THEME_DIR  e.g. /httpdocs/wp-content/themes/glitter/   (new — note the trailing slash)
#   variables: DEPLOY_ENABLED=true, PRODUCTION_URL=https://glittersocialmedia.gr, FTP_PROTOCOL (optional: ftps|ftp)
# The old FTP_TARGET_DIR secret (site root) is intentionally NOT used.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      vars.DEPLOY_ENABLED == 'true' &&
      (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ vars.PRODUCTION_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Install lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      # lftp instead of a Node FTP client: Plesk's FTPS requires TLS session reuse on the
      # data connection, which lftp supports (basic-ftp fails with ECONNRESET).
      # The password is read from LFTP_PASSWORD (--env-password), so any characters are safe.
      - name: Upload theme (FTPS, only changed files)
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          LFTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_THEME_DIR: ${{ secrets.FTP_THEME_DIR }}
          FTP_PROTOCOL: ${{ vars.FTP_PROTOCOL || 'ftps' }}  # set FTP_PROTOCOL=ftp only if the host has no FTPS
        run: |
          if [ "$FTP_PROTOCOL" = "ftp" ]; then TLS="set ftp:ssl-allow false;"; else TLS="set ftp:ssl-force true; set ftp:ssl-protect-data true; set ssl:verify-certificate true;"; fi
          lftp -c "$TLS
            set net:max-retries 2; set net:timeout 30; set net:reconnect-interval-base 5;
            open --env-password -u \"$FTP_USERNAME\" ftp://$FTP_HOST;
            mirror --reverse --delete --only-newer --no-perms --parallel=4 --verbose \
              --exclude-glob .* theme/ $FTP_THEME_DIR"

      - name: Health check
        if: vars.PRODUCTION_URL != ''
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' --retry 3 --retry-delay 5 "${{ vars.PRODUCTION_URL }}")
          echo "Homepage returned $code"
          test "$code" = 200
